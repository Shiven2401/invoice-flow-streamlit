# Emerald Green palette: emerald #1F7A63 primary, navy #081C2D second, soft white #F5F7FA, cool gray #9AA3A8
[theme]
base = "light"
primaryColor = "#1F7A63"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#081C2D"
font = "sans serif"

# the sidebar is emerald, as in the main app
[theme.sidebar]
backgroundColor = "#1F7A63"
secondaryBackgroundColor = "#17614F"
textColor = "#FFFFFF"
primaryColor = "#081C2D"

[server]
maxUploadSize = 25

[browser]
gatherUsageStats = false
