# The app's palette: violet #654CF4, ink #0E0A20, yellow #F4CB3D, mint #66C79E, in big rounded blocks
[theme]
base = "light"
primaryColor = "#654CF4"
backgroundColor = "#F3F3F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E0A20"
font = "sans serif"

# the sidebar is an ink block; yellow marks what is selected in it
[theme.sidebar]
backgroundColor = "#0E0A20"
secondaryBackgroundColor = "#1C1736"
textColor = "#FFFFFF"
primaryColor = "#F4CB3D"

[server]
maxUploadSize = 25

[browser]
gatherUsageStats = false
